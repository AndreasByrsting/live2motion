{{define "log_rows"}}
{{range .Logs}}
<div class="log-line flex gap-2 px-3 py-[3px] hover:bg-slate-900/50 border-b border-slate-900/60" data-level="{{.Level}}">
  <span class="shrink-0 text-slate-600">{{fmtTime .TS}}</span>
  <span class="shrink-0 w-11 font-semibold {{if eq .Level "error"}}text-rose-400{{else if eq .Level "warn"}}text-amber-400{{else}}text-sky-400{{end}}">{{.Level}}</span>
  <span class="shrink-0 w-20 text-slate-500 truncate" title="{{.Scope}}">{{.Scope}}</span>
  <span class="min-w-0 break-all text-slate-300">{{.Message}}</span>
</div>
{{end}}
{{if not .Logs}}
<div id="log-empty" class="px-3 py-6 text-center text-slate-600">暂无日志</div>
{{end}}
{{end}}
