{{define "health_banner"}}
{{if not .Health.OK}}
<div id="health-banner" class="notice notice-rose p-3.5">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M10.3 4.3 2.8 17.2A1.6 1.6 0 0 0 4.2 19.6h15.6a1.6 1.6 0 0 0 1.4-2.4L13.7 4.3a1.9 1.9 0 0 0-3.4 0z"/>
    <path d="M12 9v4.2M12 16.4h.01"/>
  </svg>
  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-[0.82rem] font-medium">环境检查未通过</span>
      {{if not .Health.Ready}}
      <span class="badge badge-failed">转换已暂停</span>
      {{else}}
      <span class="badge badge-pending">仅影响扫描</span>
      {{end}}
    </div>

    <ul class="mt-2.5 space-y-2">
      {{range .Health.Problems}}
      <li class="border-l border-rose-400/30 pl-2.5">
        <div class="text-[0.72rem] text-slate-200">
          <span class="font-medium">{{.Name}}</span>
          <span class="text-slate-500"> · </span>
          <span class="text-slate-300">{{.Detail}}</span>
        </div>
        {{if .Hint}}<div class="mt-0.5 text-[0.68rem] leading-relaxed opacity-75">{{.Hint}}</div>{{end}}
      </li>
      {{end}}
    </ul>
  </div>

  <button class="btn btn-mini btn-ghost shrink-0"
          hx-post="/api/actions/recheck"
          hx-target="#health-banner"
          hx-swap="outerHTML">重新检测</button>
</div>
{{else}}
<div id="health-banner"></div>
{{end}}
{{end}}
