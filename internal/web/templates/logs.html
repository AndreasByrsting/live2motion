{{define "content"}}
<div class="space-y-3">
  <div class="flex flex-wrap items-center gap-3">
    <div id="level-filter" class="flex rounded-lg border border-slate-800 overflow-hidden text-xs">
      <button data-level="all" class="seg seg-active"
              hx-get="/partials/logs?level=all" hx-target="#log-box" hx-swap="innerHTML">全部</button>
      <button data-level="info" class="seg"
              hx-get="/partials/logs?level=info" hx-target="#log-box" hx-swap="innerHTML">INFO</button>
      <button data-level="warn" class="seg"
              hx-get="/partials/logs?level=warn" hx-target="#log-box" hx-swap="innerHTML">WARN</button>
      <button data-level="error" class="seg"
              hx-get="/partials/logs?level=error" hx-target="#log-box" hx-swap="innerHTML">ERROR</button>
    </div>

    <label class="flex items-center gap-1.5 text-[0.7rem] text-slate-400 cursor-pointer select-none">
      <input type="checkbox" id="autoscroll" checked class="accent-emerald-500">
      自动滚动
    </label>

    <div class="flex-1"></div>

    <button class="btn btn-ghost" hx-post="/api/actions/clear-logs" hx-target="#toast-wrap" hx-swap="innerHTML">清空日志</button>
  </div>

  <div id="log-box" class="card-solid h-[calc(100vh-13rem)] overflow-auto font-mono text-[0.7rem] leading-5">
    {{template "log_rows" .}}
  </div>

  <div class="text-[0.7rem] text-slate-600">
    日志实时推送；断线后自动重连。滚动到顶部会暂停自动滚动。
  </div>
</div>
{{end}}
